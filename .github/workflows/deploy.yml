name: Deploy Pip's Midnight Observatory

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pip-dreams/package-lock.json

      - name: Verify project files
        run: |
          ls -la pip-dreams
          test -f pip-dreams/package.json
          test -f pip-dreams/package-lock.json

      - name: Install dependencies
        working-directory: pip-dreams
        run: npm ci --include=dev

      - name: Verify Vite
        working-directory: pip-dreams
        run: npx vite --version

      - name: Build website
        working-directory: pip-dreams
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload build files
        uses: actions/upload-pages-artifact@v3
        with:
          path: pip-dreams/dist

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4